<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Painel Principal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Bem-vindo!</h2>
  
  <ion-button expand="block" class="ion-margin-top" (click)="navegarPara('/registro-saude')">
    Registrar Nova Medição
  </ion-button>
  
  <ion-button expand="block" color="secondary" class="ion-margin-top" (click)="navegarPara('/relatorio')">
    Ver Relatório Clínico
  </ion-button>

  <ion-button expand="block" color="tertiary" class="ion-margin-top" (click)="navegarPara('/integrantes')">
    Integrantes do Grupo
  </ion-button>

  <ion-button expand="block" color="danger" fill="outline" class="ion-margin-top" (click)="navegarPara('/login')">
    Sair
  </ion-button>
</ion-content>

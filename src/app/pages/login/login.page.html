<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Sistema de Saúde Cardíaca</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">E-mail</ion-label>
        <ion-input
          type="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Senha</ion-label>
        <ion-input
          type="password"
          [(ngModel)]="senha"
          placeholder="Digite sua senha">
        </ion-input>
      </ion-item>

      <div class="ion-margin-top">
        <ion-button expand="block" (click)="fazerLogin()">
          Entrar
        </ion-button>

        <ion-button expand="block" fill="outline" (click)="irParaCadastro()">
          Ir para cadastro
        </ion-button>
      </div>

      <ion-text color="danger" *ngIf="mensagem">
        <p class="ion-margin-top">{{ mensagem }}</p>
      </ion-text>
    </ion-card-content>
  </ion-card>
</ion-content>
